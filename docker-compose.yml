services:
  postgres:
    image: postgres:17-alpine
    container_name: ligue-sportive-postgres
    environment:
      POSTGRES_DB: ligue_sportive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ligue_sportive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ligue_sportive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ligue_sportive_pgdata:

